<!doctype html>
<html lang="zh-CN" data-theme="coral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ee">
  <title>小满 · 两个人的小小宇宙</title>
  <meta name="description" content="记录日常、收藏菜谱、倒数纪念日——只属于两个人的小空间。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d96c4f'/%3E%3Cpath d='M32 48s-14-8.5-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10.5-14 19-14 19Z' fill='%23fff8ee'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Inline icon sprite: no network needed, works from file:// -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7"/><path d="M5.2 9.5V21h13.6V9.5"/><path d="M9.5 21v-6.2h5V21"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.9a5.4 5.4 0 0 0-7.7 0L12 6l-1.1-1.1a5.4 5.4 0 1 0-7.7 7.7L12 21l8.8-8.4a5.4 5.4 0 0 0 0-7.7Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.4C10.4 4.7 8.1 4 5 4v14.2c3.1 0 5.4.7 7 2.4 1.6-1.7 3.9-2.4 7-2.4V4c-3.1 0-5.4.7-7 2.4Z"/><path d="M12 6.4v14.2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="4"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.2" cy="8.2" r="1" fill="currentColor" stroke="none"/><circle cx="15.8" cy="8.2" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8.2" cy="15.8" r="1" fill="currentColor" stroke="none"/><circle cx="15.8" cy="15.8" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/><path d="M19 16.5 19.8 19l2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-13.7-5.4L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 13.7 5.4L20 16"/><path d="M20 20v-4h-4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M15.5 5.4a3.2 3.2 0 0 1 0 6.2"/><path d="M16.5 14.4a5.5 5.5 0 0 1 4 5.6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 18 5.2-5.3 3.4 3.4 2.6-2.7L21 19"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .7-7.9A5.5 5.5 0 0 0 7 9.3 4.4 4.4 0 0 0 7 18Z"/><path d="M12 12v5M9.5 14.5 12 12l2.5 2.5"/></symbol>
    <symbol id="i-cloud-check" viewBox="0 0 24 24"><path d="M7 18h9a4 4 0 0 0 .7-7.9A5.5 5.5 0 0 0 7 9.3 4.4 4.4 0 0 0 7 18Z"/><path d="m9 13 2 2 4-4"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-1.5-4-6-4-6-1 0 2 3 2 6 1Zm0 0c1.5-4 6-4 6-1 0 2-3 2-6 1Z"/></symbol>
    <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 7c0-1 1-1 1-2M12 7c0-1 1-1 1-2M16 7c0-1 1-1 1-2"/></symbol>
    <symbol id="i-drawer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 15h6"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="小满首页">
        <span class="brand-mark">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <ellipse cx="18" cy="27" rx="10" ry="13" fill="currentColor" transform="rotate(-8 18 27)"/>
            <ellipse cx="31" cy="28" rx="9" ry="12" fill="#7f9b7a" transform="rotate(8 31 28)"/>
            <circle cx="15" cy="25" r="1.15" fill="#fff8ee"/><circle cx="21" cy="25" r="1.15" fill="#fff8ee"/>
            <circle cx="28" cy="26" r="1.15" fill="#fff8ee"/><circle cx="34" cy="26" r="1.15" fill="#fff8ee"/>
            <path d="M15.5 31c1.3 1.4 3.2 1.4 4.5 0M28.5 32c1.2 1.2 2.9 1.2 4.1 0" stroke="#fff8ee" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text"><strong>小满</strong><small>两个人的小小宇宙</small></span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a href="#home" data-nav="home"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></a>
        <a href="#moments" data-nav="moments"><svg class="icon"><use href="#i-heart"/></svg><span>日常</span></a>
        <a href="#recipes" data-nav="recipes"><svg class="icon"><use href="#i-book"/></svg><span>菜谱</span></a>
        <a href="#days" data-nav="days"><svg class="icon"><use href="#i-calendar"/></svg><span>纪念日</span></a>
        <a href="#settings" data-nav="settings"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></a>
      </nav>

      <div class="side-card">
        <div class="side-avatars">
          <span class="avatar me" id="side-avatar-me">满</span>
          <span class="side-heart">♥</span>
          <span class="avatar partner" id="side-avatar-partner">糖</span>
        </div>
        <p class="side-days" id="side-days">在一起的第 <strong>0</strong> 天</p>
        <p class="side-quote">好好吃饭，好好相爱。</p>
        <button class="sync-mini" type="button" data-action="open-sync">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-label">同步未开启</span>
          <svg class="icon"><use href="#i-cloud"/></svg>
        </button>
      </div>
      <p class="sidebar-foot">LOCAL FIRST · 可同步到坚果云</p>
    </aside>

    <header class="mobile-topbar">
      <a class="brand-mini" href="#home" aria-label="小满首页">
        <span class="brand-mark small">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <ellipse cx="18" cy="27" rx="10" ry="13" fill="currentColor" transform="rotate(-8 18 27)"/>
            <ellipse cx="31" cy="28" rx="9" ry="12" fill="#7f9b7a" transform="rotate(8 31 28)"/>
            <circle cx="15" cy="25" r="1.15" fill="#fff8ee"/><circle cx="21" cy="25" r="1.15" fill="#fff8ee"/>
            <circle cx="28" cy="26" r="1.15" fill="#fff8ee"/><circle cx="34" cy="26" r="1.15" fill="#fff8ee"/>
          </svg>
        </span>
        <span>小满</span>
      </a>
      <button class="topbar-sync" type="button" data-action="open-sync" aria-label="同步">
        <span class="sync-dot" id="sync-dot-mobile"></span>
        <svg class="icon"><use href="#i-cloud"/></svg>
      </button>
    </header>

    <main id="main">
      <div id="view" aria-live="polite">
        <div class="loading">
          <span class="loading-bean"></span>
          <p>正在打开你们的小宇宙…</p>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="底部导航">
      <a href="#home" data-nav="home"><span class="nav-icon"><svg class="icon"><use href="#i-home"/></svg></span><span>首页</span></a>
      <a href="#moments" data-nav="moments"><span class="nav-icon"><svg class="icon"><use href="#i-heart"/></svg></span><span>日常</span></a>
      <a href="#recipes" data-nav="recipes"><span class="nav-icon"><svg class="icon"><use href="#i-book"/></svg></span><span>菜谱</span></a>
      <a href="#days" data-nav="days"><span class="nav-icon"><svg class="icon"><use href="#i-calendar"/></svg></span><span>纪念日</span></a>
      <a href="#settings" data-nav="settings"><span class="nav-icon"><svg class="icon"><use href="#i-settings"/></svg></span><span>设置</span></a>
    </nav>
  </div>

  <button class="fab" id="fab" type="button" data-action="quick-add" aria-label="快速添加">
    <svg class="icon"><use href="#i-plus"/></svg>
  </button>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-action="close-modal" aria-label="关闭">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
      <header class="modal-head">
        <p class="eyebrow" id="modal-eyebrow"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-subtitle"></p>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="confirm" id="confirm" aria-hidden="true">
    <div class="confirm-backdrop" data-action="confirm-no"></div>
    <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <span class="confirm-icon">!</span>
      <h3 id="confirm-title"></h3>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" type="button" data-action="confirm-no">再想想</button>
        <button class="btn btn-danger" type="button" id="confirm-yes" data-action="confirm-yes">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
