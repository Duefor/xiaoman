<!doctype html>
<html lang="zh-CN" data-theme="coral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ee">
  <title>小满 · 两个人的小小宇宙</title>
  <meta name="description" content="记录日常、收藏菜谱、倒数纪念日——只属于两个人的小空间。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d96c4f'/%3E%3Cpath d='M32 48s-14-8.5-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10.5-14 19-14 19Z' fill='%23fff8ee'/%3E%3C/svg%3E">
  <style>
/* ==========================================================================
   小满 · 两个人的小小宇宙
   A warm, local-first couple space. Hand-written CSS, no dependencies.
   ========================================================================== */

:root {
  --bg: #faf6ee;
  --surface: #fffdf8;
  --surface-2: #f6efe4;
  --surface-3: #f1e7d8;
  --ink: #3b3631;
  --ink-soft: #574f47;
  --muted: #8d8377;
  --muted-2: #a89d90;
  --line: #e9dfd1;
  --line-strong: #ddd0be;
  --accent: #d96c4f;
  --accent-deep: #b64f34;
  --accent-soft: #f7ded2;
  --accent-wash: #fdf1ea;
  --partner: #7f9b7a;
  --partner-soft: #e2ebdd;
  --yellow: #f2cf8c;
  --yellow-soft: #fbf0d9;
  --danger: #b65045;
  --dark: #3f3831;
  --dark-2: #554a40;
  --serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --mono-num: Georgia, "Times New Roman", "Songti SC", serif;
  --shadow-sm: 0 8px 22px -18px rgba(72, 52, 36, .55);
  --shadow: 0 20px 50px -32px rgba(72, 52, 36, .45);
  --shadow-lg: 0 34px 80px -44px rgba(56, 39, 26, .55);
  --radius: 24px;
  --ease: cubic-bezier(.22, .8, .28, 1);
}

html[data-theme="sage"] {
  --accent: #789273;
  --accent-deep: #5b7457;
  --accent-soft: #e1eadb;
  --accent-wash: #f1f6ed;
  --partner: #d18462;
  --partner-soft: #f7e1d6;
}

html[data-theme="sky"] {
  --accent: #6f8fae;
  --accent-deep: #526f8c;
  --accent-soft: #dfe9f2;
  --accent-wash: #eff5fa;
  --partner: #d18b6d;
  --partner-soft: #f7e3d8;
}

html[data-theme="taro"] {
  --accent: #9583b4;
  --accent-deep: #75638f;
  --accent-soft: #eae3f2;
  --accent-wash: #f6f1fa;
  --partner: #82a07d;
  --partner-soft: #e3ecdf;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-width: 300px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(83, 64, 48, .055) .7px, transparent .7px);
  background-size: 18px 18px;
  mask-image: linear-gradient(to bottom, #000, rgba(0, 0, 0, .25));
}

body.modal-open {
  overflow: hidden;
}

::selection {
  background: var(--accent-soft);
  color: var(--accent-deep);
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

h1, h2, h3, h4, p {
  margin-top: 0;
}

.sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.icon {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon.fill {
  fill: currentColor;
  stroke: none;
}

.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ==========================================================================
   Shell + sidebar
   ========================================================================== */

.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  max-width: 1340px;
  min-height: 100dvh;
  margin: 0 auto;
}

.sidebar {
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding: 34px 24px 24px;
  border-right: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  flex: none;
  color: var(--accent);
  background: linear-gradient(145deg, #fff, var(--accent-wash));
  border: 1px solid rgba(217, 108, 79, .16);
  border-radius: 17px;
  box-shadow: 0 10px 24px -18px rgba(120, 70, 45, .7);
}

.brand-mark svg {
  width: 34px;
  height: 34px;
}

.brand-mark.small {
  width: 34px;
  height: 34px;
  border-radius: 12px;
}

.brand-mark.small svg {
  width: 26px;
  height: 26px;
}

.brand-text {
  min-width: 0;
}

.brand-text strong {
  display: block;
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: .12em;
}

.brand-text small {
  display: block;
  margin-top: 5px;
  overflow: hidden;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .1em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 42px;
}

.nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .02em;
  transition: color .2s, background .2s, transform .2s, box-shadow .2s;
}

.nav a .icon {
  width: 19px;
  height: 19px;
  opacity: .9;
}

.nav a:hover {
  color: var(--ink);
  background: rgba(255, 255, 255, .62);
  transform: translateX(2px);
}

.nav a.active {
  color: var(--accent-deep);
  background: var(--surface);
  border-color: rgba(217, 108, 79, .1);
  box-shadow: var(--shadow-sm);
}

.nav a.active .icon {
  opacity: 1;
}

.side-card {
  margin-top: auto;
  padding: 18px;
  background:
    radial-gradient(130% 120% at 100% 0%, var(--accent-wash), transparent 60%),
    var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
}

.side-avatars {
  display: flex;
  align-items: center;
  margin-bottom: 13px;
}

.avatar {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  color: #fff;
  border: 3px solid #fff;
  border-radius: 50%;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 4px 12px -6px rgba(60, 40, 25, .5);
}

.avatar.me {
  background: var(--accent);
}

.avatar.partner {
  background: var(--partner);
  margin-left: -11px;
}

.side-heart {
  margin-left: 7px;
  color: var(--accent);
  font-size: 12px;
  transform: rotate(-8deg);
}

.side-days {
  margin-bottom: 3px;
  color: var(--ink-soft);
  font-size: 12.5px;
}

.side-days strong {
  color: var(--ink);
  font-family: var(--mono-num);
  font-size: 17px;
  font-weight: 700;
}

.side-quote {
  margin: 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: .04em;
}

.sidebar-foot {
  margin: 14px 0 0;
  color: var(--muted-2);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: .16em;
  text-align: center;
}

/* ==========================================================================
   Main + page headings
   ========================================================================== */

.mobile-topbar,
.bottom-nav,
.fab {
  display: none;
}

#main {
  min-width: 0;
}

#view {
  max-width: 1050px;
  margin: 0 auto;
  padding: 38px 44px 72px;
}

.loading {
  display: grid;
  place-items: center;
  min-height: 70vh;
  color: var(--muted);
  font-family: var(--serif);
  letter-spacing: .06em;
}

.loading-bean {
  width: 20px;
  height: 26px;
  margin-bottom: 12px;
  background: var(--accent);
  border-radius: 50%;
  animation: bob 1.2s ease-in-out infinite;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 22px;
  margin-bottom: 26px;
}

.eyebrow {
  margin: 0 0 9px;
  color: var(--accent-deep);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .2em;
  line-height: 1.4;
  text-transform: uppercase;
}

.page-title {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(30px, 3.4vw, 42px);
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: .02em;
}

.page-sub {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: none;
  padding-bottom: 2px;
}

/* ==========================================================================
   Buttons + chips
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 9px 17px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .01em;
  cursor: pointer;
  transition: transform .18s var(--ease), background .18s, color .18s, border-color .18s, box-shadow .18s;
  -webkit-tap-highlight-color: transparent;
}

.btn .icon {
  width: 17px;
  height: 17px;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0) scale(.98);
}

.btn-primary {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 12px 24px -14px rgba(160, 75, 48, .8);
}

.btn-primary:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}

.btn-ghost {
  color: var(--ink-soft);
  background: var(--surface);
  border-color: var(--line);
}

.btn-ghost:hover {
  border-color: var(--line-strong);
  background: #fff;
}

.btn-soft {
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-color: transparent;
}

.btn-soft:hover {
  background: var(--accent-wash);
}

.btn.is-done {
  color: var(--partner);
  background: var(--partner-soft);
  border-color: transparent;
  box-shadow: none;
}

.btn-danger {
  color: #fff;
  background: var(--danger);
  border-color: var(--danger);
}

.btn-danger:hover {
  background: #9d3e35;
}

.btn-sm {
  min-height: 33px;
  padding: 6px 12px;
  font-size: 11.5px;
}

.btn-block {
  width: 100%;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  padding: 0;
  color: var(--muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 50%;
  cursor: pointer;
  transition: background .18s, color .18s, transform .18s;
  -webkit-tap-highlight-color: transparent;
}

.icon-btn .icon {
  width: 17px;
  height: 17px;
}

.icon-btn:hover {
  color: var(--ink);
  background: var(--surface-2);
}

.icon-btn.danger:hover {
  color: var(--danger);
  background: #fbebe8;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 31px;
  padding: 5px 12px;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all .18s;
}

.chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface);
}

.chip.active {
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-color: transparent;
}

.chips-row {
  display: flex;
  align-items: center;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.chips-row::-webkit-scrollbar {
  display: none;
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  color: var(--accent-deep);
  background: var(--accent-wash);
  border: 1px solid rgba(217, 108, 79, .1);
  border-radius: 999px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .03em;
  white-space: nowrap;
}

/* ==========================================================================
   Home
   ========================================================================== */

.home-head {
  align-items: center;
  margin-bottom: 22px;
}

.home-head h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(30px, 3.6vw, 44px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: .01em;
}

.home-head h1 .hello-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-left: 6px;
  vertical-align: 14px;
  background: var(--accent);
  border-radius: 50%;
}

.home-head .page-sub {
  margin-top: 7px;
}

.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.28fr) minmax(210px, .72fr);
  gap: 18px;
  overflow: hidden;
  padding: 34px 38px 22px;
  background:
    radial-gradient(110% 150% at 100% 0%, #f0d9c9 0%, transparent 54%),
    radial-gradient(90% 120% at 0% 100%, #f7efdf 0%, transparent 58%),
    linear-gradient(125deg, #fffaf3 0%, #fbeee2 58%, #f2e6d3 100%);
  border: 1px solid #ead9c9;
  border-radius: 30px;
  box-shadow: var(--shadow);
  isolation: isolate;
}

.hero::before {
  content: "";
  position: absolute;
  right: -92px;
  bottom: -152px;
  z-index: -1;
  width: 310px;
  height: 310px;
  border: 1px dashed rgba(170, 115, 85, .28);
  border-radius: 50%;
}

.hero::after {
  content: "";
  position: absolute;
  left: 42%;
  top: -110px;
  z-index: -1;
  width: 220px;
  height: 220px;
  border: 1px solid rgba(255, 255, 255, .7);
  border-radius: 50%;
}

.hero-copy {
  min-width: 0;
  padding-top: 2px;
}

.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  color: var(--accent-deep);
  background: rgba(255, 255, 255, .58);
  border: 1px solid rgba(255, 255, 255, .95);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .14em;
}

.hero-kicker::before {
  content: "";
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(217, 108, 79, .12);
}

.hero-days {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin: 15px 0 2px;
}

.hero-days .num {
  color: var(--ink);
  font-family: var(--mono-num);
  font-size: clamp(66px, 8.2vw, 98px);
  font-weight: 700;
  line-height: .9;
  letter-spacing: -.055em;
  font-variant-numeric: tabular-nums;
}

.hero-days .unit {
  color: var(--accent-deep);
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .05em;
}

.hero-names {
  margin: 8px 0 0;
  color: #7d6b5c;
  font-size: 12.5px;
  letter-spacing: .01em;
}

.hero-names strong {
  color: var(--ink-soft);
  font-weight: 700;
}

.hero-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 18px;
}

.hero-chips span {
  padding: 5px 10px;
  color: #7b695a;
  background: rgba(255, 255, 255, .55);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .02em;
}

.hero-chips strong {
  color: var(--ink-soft);
  font-family: var(--mono-num);
  font-size: 11px;
}

.hero-art {
  position: relative;
  display: grid;
  place-items: center;
  align-self: center;
  min-height: 210px;
}

.hero-art::before {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  background: rgba(255, 255, 255, .38);
  border: 1px solid rgba(255, 255, 255, .8);
  border-radius: 50%;
  filter: blur(1px);
}

.hero-art svg {
  position: relative;
  z-index: 1;
  width: min(100%, 272px);
  height: auto;
  filter: drop-shadow(0 24px 24px rgba(120, 80, 50, .16));
  animation: float 7s ease-in-out infinite;
}

.hero-art .art-note {
  position: absolute;
  right: 2px;
  bottom: 3px;
  z-index: 2;
  padding: 5px 10px;
  color: var(--accent-deep);
  background: rgba(255, 253, 248, .9);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 999px;
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: .08em;
  transform: rotate(-3deg);
  box-shadow: 0 8px 18px -12px rgba(90, 60, 40, .5);
}

.hero-next {
  display: flex;
  grid-column: 1 / -1;
  align-items: center;
  gap: 12px;
  min-width: 0;
  margin-top: 4px;
  padding: 11px 14px;
  background: rgba(255, 255, 255, .52);
  border: 1px solid rgba(255, 255, 255, .92);
  border-radius: 16px;
  transition: background .2s, transform .2s;
}

.hero-next:hover {
  background: rgba(255, 255, 255, .78);
  transform: translateY(-1px);
}

.hero-next-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  background: rgba(255, 255, 255, .86);
  border-radius: 12px;
  font-size: 18px;
}

.hero-next-copy {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  line-height: 1.35;
}

.hero-next-copy small {
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .08em;
}

.hero-next-copy strong {
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hero-next-copy em {
  color: var(--accent-deep);
  font-style: normal;
}

.hero-next > .icon {
  width: 16px;
  height: 16px;
  color: var(--muted);
}

.welcome-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 18px;
  padding: 11px 14px;
  color: var(--accent-deep);
  background: var(--accent-soft);
  border: 1px solid rgba(255, 255, 255, .55);
  border-radius: 15px;
  font-size: 12px;
}

.welcome-banner .icon {
  width: 17px;
  height: 17px;
}

.welcome-banner p {
  flex: 1;
  margin: 0;
}

.welcome-banner a {
  font-weight: 700;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.welcome-banner .icon-btn {
  width: 26px;
  height: 26px;
  color: currentColor;
}

.home-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.46fr) minmax(272px, .74fr);
  gap: 21px;
  align-items: start;
  margin-top: 22px;
}

.panel {
  min-width: 0;
  padding: 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

.dinner-name {

}

.dinner-desc {

.dinner-meta {

.dinner-meta span {

.dinner-meta .icon {

.dinner-actions {

.dinner-actions .btn {

.prompt-panel {

.prompt-panel::after {

.prompt-label {

.prompt-label .icon {

.prompt-text {

.prompt-panel .btn {

/* ==========================================================================
   Moments
   ========================================================================== */

.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.count-note {
  color: var(--muted-2);
  font-size: 10.5px;
  white-space: nowrap;
}

.timeline {
  position: relative;
}

.timeline-group {
  position: relative;
  padding-left: 28px;
}

.timeline-group::before {
  content: "";
  position: absolute;
  top: 9px;
  bottom: -20px;
  left: 7px;
  width: 1px;
  background: linear-gradient(to bottom, var(--line-strong), transparent);
}

.timeline-group:last-child::before {
  display: none;
}

.timeline-date {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0 0 11px;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .03em;
}

.timeline-date::before {
  content: "";
  position: absolute;
  top: 5px;
  left: -25px;
  width: 7px;
  height: 7px;
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 50%;
}

.timeline-date small {
  color: var(--muted-2);
  font-size: 9.5px;
  font-weight: 500;
}

.timeline-group + .timeline-group {
  margin-top: 24px;
}

.moment-card {
  position: relative;
  margin-bottom: 13px;
  padding: 18px 19px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  transition: transform .2s var(--ease), box-shadow .2s, border-color .2s;
}

.moment-card:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}

.moment-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}

.moment-author {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.3;
}

.moment-author strong {
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 700;
}

.moment-author span {
  color: var(--muted-2);
  font-size: 9px;
}

.moment-tools {
  display: flex;
  gap: 2px;
  margin-left: auto;
  opacity: .5;
  transition: opacity .2s;
}

.moment-card:hover .moment-tools,
.moment-tools:focus-within {
  opacity: 1;
}

.moment-tools .icon-btn {
  width: 28px;
  height: 28px;
}

.moment-tools .icon-btn .icon {
  width: 14px;
  height: 14px;
}

.moment-text {
  margin: 0;
  color: var(--ink-soft);
  font-size: 13.5px;
  line-height: 1.82;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.moment-photo {
  width: 100%;
  max-height: 420px;
  margin-top: 12px;
  object-fit: cover;
  border-radius: 15px;
  background: var(--surface-2);
}

.moment-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 11px;
}

.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  color: var(--ink-soft);
  background: var(--surface-2);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
}

.mood-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.moment-place {
  margin-left: auto;
  color: var(--muted-2);
  font-size: 9px;
}

/* ==========================================================================
   Recipes
   ========================================================================== */

.recipe-toolbar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
  width: min(100%, 330px);
}

.search-box .icon {
  position: absolute;
  left: 13px;
  width: 15px;
  height: 15px;
  color: var(--muted-2);
  pointer-events: none;
}

.search-box input {
  width: 100%;
  height: 40px;
  padding: 0 14px 0 37px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

.search-box input::placeholder {
  color: var(--muted-2);
}

.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-wash);
}

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(222px, 1fr));
  gap: 17px;
}

.recipe-card {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 21px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  outline: none;
  transition: transform .22s var(--ease), box-shadow .22s, border-color .22s;
}

.recipe-card:hover,
.recipe-card:focus-visible {
  transform: translateY(-4px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}

.recipe-card:focus-visible {
  box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow);
}

.recipe-cover {
  position: relative;
  display: grid;
  place-items: center;
  height: 136px;
  overflow: hidden;
  isolation: isolate;
}

.recipe-cover::before,
.recipe-cover::after {
  content: "";
  position: absolute;
  z-index: -1;
  border-radius: 50%;
  filter: blur(.2px);
}

.recipe-cover::before {
  width: 112px;
  height: 112px;
  top: -36px;
  right: -24px;
  background: rgba(255, 255, 255, .36);
}

.recipe-cover::after {
  width: 84px;
  height: 84px;
  bottom: -38px;
  left: -24px;
  border: 1px solid rgba(255, 255, 255, .55);
}

.recipe-emoji {
  font-size: 52px;
  filter: drop-shadow(0 12px 13px rgba(75, 45, 30, .18));
  transform: rotate(-4deg);
  transition: transform .25s var(--ease);
}

.recipe-card:hover .recipe-emoji {
  transform: rotate(4deg) scale(1.08);
}

.palette-0 { background: linear-gradient(145deg, #fbe4d7, #f4cdbb); }
.palette-1 { background: linear-gradient(145deg, #e6efdf, #cadcc3); }
.palette-2 { background: linear-gradient(145deg, #f9edca, #f1dda9); }
.palette-3 { background: linear-gradient(145deg, #e3e9f2, #c9d6e5); }
.palette-4 { background: linear-gradient(145deg, #efe4f2, #ddcbe3); }
.palette-5 { background: linear-gradient(145deg, #f5e1dd, #e9c8c7); }

.recipe-fav {
  position: absolute;
  top: 10px;
  right: 10px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  color: rgba(90, 65, 45, .55);
  background: rgba(255, 255, 255, .58);
  border: 1px solid rgba(255, 255, 255, .78);
  border-radius: 50%;
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background .18s, color .18s, transform .18s;
}

.recipe-fav .icon {
  width: 15px;
  height: 15px;
  fill: transparent;
  stroke-width: 2;
}

.recipe-fav:hover {
  color: var(--accent-deep);
  background: rgba(255, 255, 255, .9);
  transform: scale(1.06);
}

.recipe-fav.is-fav {
  color: #c85145;
  background: rgba(255, 255, 255, .85);
}

.recipe-fav.is-fav .icon {
  fill: currentColor;
  stroke: currentColor;
}

.recipe-time {
  position: absolute;
  bottom: 10px;
  left: 11px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  color: #6e5a49;
  background: rgba(255, 255, 255, .68);
  border: 1px solid rgba(255, 255, 255, .6);
  border-radius: 999px;
  font-size: 9px;
  font-weight: 700;
  backdrop-filter: blur(5px);
}

.recipe-time .icon {
  width: 11px;
  height: 11px;
}

.recipe-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  padding: 13px 15px 15px;
}

.recipe-name {
  margin: 0 0 3px;
  overflow: hidden;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.recipe-desc {
  display: -webkit-box;
  overflow: hidden;
  margin: 0 0 9px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.6;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.recipe-foot {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: auto;
}

.recipe-foot .tag {
  font-size: 8.5px;
  padding: 2px 7px;
}

.recipe-cooked {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  color: var(--partner);
  font-size: 8.5px;
  font-weight: 700;
  white-space: nowrap;
}

.recipe-cooked .icon {
  width: 11px;
  height: 11px;
}

.recipe-empty {
  grid-column: 1 / -1;
}

/* ==========================================================================
   Anniversaries
   ========================================================================== */

.anniv-feature {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 22px;
  overflow: hidden;
  margin-bottom: 21px;
  padding: 30px 32px;
  color: #f9f1e6;
  background:
    radial-gradient(100% 140% at 100% 0%, rgba(217, 108, 79, .38), transparent 52%),
    linear-gradient(135deg, #3f3831, #55483c);
  border: 1px solid #4c4239;
  border-radius: 28px;
  box-shadow: var(--shadow-lg);
  isolation: isolate;
}

.anniv-feature::before {
  content: "";
  position: absolute;
  right: -68px;
  bottom: -118px;
  z-index: -1;
  width: 270px;
  height: 270px;
  border: 1px solid rgba(255, 238, 218, .14);
  border-radius: 50%;
}

.anniv-feature .eyebrow {
  color: #e6b69c;
}

.anniv-feature-title {
  margin: 0 0 7px;
  font-family: var(--serif);
  font-size: clamp(25px, 3vw, 34px);
  font-weight: 700;
  letter-spacing: .03em;
}

.anniv-feature-date {
  margin: 0;
  color: #c9b9a7;
  font-size: 11px;
}

.anniv-count {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  min-width: 140px;
  line-height: 1;
}

.anniv-count .num {
  color: #f3c8a8;
  font-family: var(--mono-num);
  font-size: clamp(58px, 7vw, 80px);
  font-weight: 700;
  letter-spacing: -.04em;
}

.anniv-count .unit {
  margin-top: 5px;
  color: #d9c4b2;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .18em;
}

.anniv-count.is-today .num {
  font-family: var(--serif);
  font-size: clamp(34px, 5vw, 48px);
  letter-spacing: .08em;
}

.anniv-progress {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 13px;
  margin-top: 2px;
}

.anniv-progress-bar {
  position: relative;
  flex: 1;
  height: 4px;
  overflow: hidden;
  background: rgba(255, 255, 255, .12);
  border-radius: 999px;
}

.anniv-progress-bar span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #d88767, #f3c8a8);
  border-radius: inherit;
  transition: width .7s var(--ease);
}

.anniv-progress small {
  color: #bda997;
  font-size: 9px;
  white-space: nowrap;

.anniv-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.anniv-row {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
  padding: 15px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, border-color .2s, box-shadow .2s;
}

.anniv-row:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}

.anniv-icon {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  flex: none;
  background: var(--accent-wash);
  border: 1px solid rgba(217, 108, 79, .1);
  border-radius: 15px;
  font-size: 21px;
}

.anniv-row-main {
  flex: 1;
  min-width: 0;
  line-height: 1.35;
}

.anniv-row-main strong {
  display: block;
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.anniv-row-main small {
  display: block;
  margin-top: 3px;
  overflow: hidden;
  color: var(--muted-2);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.anniv-row-main .recurring {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 5px;
  color: var(--partner);
  background: var(--partner-soft);
  border-radius: 4px;
  font-size: 8px;
  font-weight: 700;
  vertical-align: 1px;
}

.anniv-days {
  flex: none;
  text-align: right;
  line-height: 1.25;
}

.anniv-days strong {
  display: block;
  color: var(--accent-deep);
  font-family: var(--mono-num);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.anniv-days small {
  color: var(--muted-2);
  font-size: 8px;
}

.anniv-days.past strong {
  color: var(--muted);
}

.anniv-row-tools {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-left: 1px;
  opacity: .3;
  transition: opacity .2s;
}

.anniv-row:hover .anniv-row-tools,
.anniv-row-tools:focus-within {
  opacity: 1;
}

.anniv-row-tools .icon-btn {
  width: 25px;
  height: 25px;
}

.anniv-row-tools .icon-btn .icon {
  width: 12px;
  height: 12px;
}

/* ==========================================================================
   Settings
   ========================================================================== */

.settings-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
  gap: 19px;
  align-items: start;
}

.settings-panel {
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.settings-panel h2 {
  margin: 0 0 4px;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .03em;
}

.settings-panel > .settings-note {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 10.5px;
}

.settings-panel.full {
  grid-column: 1 / -1;
}

.settings-panel.danger-zone {
  border-color: #ecd2cb;
  background: #fffbf9;
}

.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 4px;
}

.theme-option {

  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .18s;
}

.theme-option:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
}

.theme-option.active {
  border-color: var(--accent);
  background: var(--accent-wash);
}

.theme-swatch {
  width: 27px;
  height: 27px;
  flex: none;
  border-radius: 9px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5);
}

.theme-swatch.coral { background: linear-gradient(135deg, #e99a7e, #c95b3f); }
.theme-swatch.sage { background: linear-gradient(135deg, #a8bfa1, #6f8c69); }
.theme-swatch.sky { background: linear-gradient(135deg, #a3bbd0, #6485a4); }
.theme-swatch.taro { background: linear-gradient(135deg, #c3b1d8, #8d79ad); }

.theme-option .check {
  display: none;
  margin-left: auto;
  color: var(--accent-deep);
}

.theme-option.active .check {
  display: block;
}

.theme-option .check .icon {
  width: 14px;
  height: 14px;
}

.data-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.privacy-box {
  display: flex;
  gap: 11px;
  margin-top: 15px;
  padding: 13px 14px;
  color: var(--muted);
  background: var(--surface-2);
  border-radius: 14px;
  font-size: 10px;
  line-height: 1.65;
}

.privacy-box .icon {
  width: 16px;
  height: 16px;
  flex: none;
  margin-top: 1px;
  color: var(--partner);
}

.privacy-box p {
  margin: 0;
}

.about-lines {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
  color: var(--muted);
  font-size: 10.5px;
}

.about-lines li {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.about-lines li::before {
  content: "·";
  color: var(--accent);
  font-weight: 700;
}

/* ==========================================================================
   Forms
   ========================================================================== */

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.form-grid .span-2 {
  grid-column: 1 / -1;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field > label,
.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
}

.field > label em {
  color: var(--accent);
  font-style: normal;
}

.field-hint {
  color: var(--muted-2);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0;
}

.input,
.textarea,
.select {
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  color: var(--ink);
  background: #fffdf9;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 12.5px;
  line-height: 1.6;
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
}

.textarea {
  min-height: 94px;
  resize: vertical;
}

.input::placeholder,
.textarea::placeholder {
  color: var(--muted-2);
}

.input:focus,
.textarea:focus,
.select:focus {
  background: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-wash);
}

.input[type="date"],
.input[type="datetime-local"],
.input[type="number"] {
  appearance: none;
}

.select {
  cursor: pointer;
}

.form-section {
  padding-top: 4px;
}

.form-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 4px 0 9px;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 700;
}

.form-section-title small {
  color: var(--muted-2);
  font-family: var(--sans);
  font-size: 8.5px;
  font-weight: 500;
}

.segmented {
  display: flex;
  gap: 4px;
  padding: 3px;
  background: var(--surface-2);
  border-radius: 11px;
}

.segmented button {
  flex: 1;
  padding: 6px 8px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 8px;
  font-size: 10.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .18s;
}

.segmented button.active {
  color: var(--accent-deep);
  background: #fff;
  box-shadow: 0 2px 8px -4px rgba(70, 50, 35, .35);
}

.mood-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.mood-option {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 9px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all .18s;
}

.mood-option:hover {
  border-color: var(--line-strong);
}

.mood-option.active {
  color: var(--accent-deep);
  background: var(--accent-wash);
  border-color: var(--accent);
}

.emoji-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.emoji-option {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
}

.emoji-option:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
}

.emoji-option.active {
  background: var(--accent-wash);
  border-color: var(--accent);
  transform: scale(1.04);
}

.photo-zone {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 74px;
  padding: 10px;
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
}

.photo-zone.has-photo {
  align-items: flex-start;
  padding: 8px;
}

.photo-preview {
  width: 88px;
  height: 62px;
  flex: none;
  object-fit: cover;
  border-radius: 9px;
}

.photo-placeholder {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.photo-placeholder .icon {
  width: 20px;
  height: 20px;
  color: var(--accent);
}

.photo-copy {
  flex: 1;
  min-width: 0;
}

.photo-copy strong {
  display: block;
  color: var(--ink-soft);
  font-size: 10.5px;
}

.photo-copy small {
  display: block;
  color: var(--muted-2);
  font-size: 8.5px;
}

.photo-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.photo-actions {
  display: flex;
  flex: none;
  gap: 5px;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  color: var(--ink-soft);
  font-size: 11px;
  cursor: pointer;
}

.check-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.char-count {
  color: var(--muted-2);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0;
}

.dynamic-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.ingredient-row {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) 29px;
  gap: 6px;
  align-items: center;
}

.step-row {
  display: grid;
  grid-template-columns: 29px minmax(0, 1fr) 29px;
  gap: 6px;
  align-items: start;
}

.step-index {
  display: grid;
  place-items: center;
  width: 25px;
  height: 25px;
  margin-top: 8px;
  color: var(--accent-deep);
  background: var(--accent-wash);
  border-radius: 50%;
  font-family: var(--mono-num);
  font-size: 10px;
  font-weight: 700;
}

.row-remove {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  margin-top: 7px;
  padding: 0;
  color: var(--muted-2);
  background: transparent;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
}

.row-remove:hover {
  color: var(--danger);
  background: #fbebe8;
}

.row-remove .icon {
  width: 14px;
  height: 14px;
}

.add-row-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 100%;
  padding: 8px;
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  font-size: 9.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .18s;
}

.add-row-btn:hover {
  color: var(--accent-deep);
  background: var(--accent-wash);
  border-color: var(--accent);
}

.add-row-btn .icon {
  width: 13px;
  height: 13px;
}

.form-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 19px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
}

.form-actions .spacer {
  flex: 1;
}

.form-actions .btn {
  min-width: 88px;
}

.required-hint {
  margin: 11px 0 0;
  color: var(--muted-2);
  font-size: 8.5px;
  text-align: right;
}

/* ==========================================================================
   Modal
   ========================================================================== */

.modal {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: none;
}

.modal.open {
  display: block;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(46, 38, 31, .48);
  backdrop-filter: blur(5px);
  animation: fade-in .22s both;
}

.sheet {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(640px, calc(100vw - 32px));
  max-height: min(89dvh, 940px);
  overflow: auto;
  padding: 26px 27px;
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, .8);
  border-radius: 26px;
  box-shadow: 0 40px 100px -36px rgba(40, 27, 17, .65);
  transform: translate(-50%, -50%);
  animation: modal-pop .28s var(--ease) both;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.sheet.wide {
  width: min(760px, calc(100vw - 32px));
}

.sheet::-webkit-scrollbar {
  width: 6px;
}

.sheet::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 99px;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 50%;
  cursor: pointer;
  transition: all .18s;
}

.modal-close:hover {
  color: var(--ink);
  background: var(--surface-3);
}

.modal-close .icon {
  width: 15px;
  height: 15px;
}

.modal-head {
  padding-right: 34px;
  margin-bottom: 19px;
}

.modal-head h2 {
  margin: 0 0 4px;
  font-family: var(--serif);
  font-size: 25px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: .02em;
}

.modal-head > p:last-child {
  margin: 0;
  color: var(--muted);
  font-size: 10.5px;
}

.modal-head .eyebrow {
  margin-bottom: 6px;
}

/* Recipe detail */

.recipe-detail-cover {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 17px;
  padding: 16px;
  border-radius: 18px;
}

.recipe-detail-cover .emoji {
  display: grid;
  place-items: center;
  width: 66px;
  height: 66px;
  flex: none;
  background: rgba(255, 255, 255, .45);
  border-radius: 18px;
  font-size: 34px;
}

.recipe-detail-cover h3 {
  margin: 0 0 3px;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 700;
}

.recipe-detail-cover p {
  margin: 0;
  color: #6d5a49;
  font-size: 10.5px;
  line-height: 1.55;
}

.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.detail-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  color: var(--muted);
  background: var(--surface-2);
  border-radius: 999px;
  font-size: 9.5px;
}

.detail-meta .icon {
  width: 12px;
  height: 12px;
}

.detail-section {
  margin-top: 18px;
}

.detail-section h4 {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 9px;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
}

.detail-section h4::before {
  content: "";
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
}

.ingredient-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 3px 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.ingredient-list li {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  padding: 6px 0;
  color: var(--ink-soft);
  border-bottom: 1px dashed var(--line);
  font-size: 11px;
}

.ingredient-list input {
  width: 14px;
  height: 14px;
  flex: none;
  accent-color: var(--accent);
}

.ingredient-list label {
  display: flex;
  flex: 1;
  gap: 7px;
  align-items: baseline;
  min-width: 0;
  cursor: pointer;
}

.ingredient-list label span:first-child {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ingredient-list label span:last-child {
  flex: none;
  color: var(--muted);
  font-size: 9.5px;
}

.ingredient-list input:checked + label {
  color: var(--muted-2);
  text-decoration: line-through;
}

.step-list {
  counter-reset: steps;
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.step-list li {
  display: flex;
  gap: 11px;
  color: var(--ink-soft);
  font-size: 11.5px;
  line-height: 1.72;
}

.step-list li::before {
  counter-increment: steps;
  content: counter(steps, decimal-leading-zero);
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  flex: none;
  margin-top: 1px;
  color: var(--accent-deep);
  background: var(--accent-wash);
  border-radius: 50%;
  font-family: var(--mono-num);
  font-size: 8.5px;
  font-weight: 700;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
}

.detail-actions .spacer {
  flex: 1;
}

/* ==========================================================================
   Confirm + toast + empty states
   ========================================================================== */

.confirm {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
}

.confirm.open {
  display: grid;
  place-items: center;
  padding: 20px;
}

.confirm-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(46, 38, 31, .5);
  backdrop-filter: blur(5px);
  animation: fade-in .2s both;
}

.confirm-card {
  position: relative;
  width: min(380px, 100%);
  padding: 26px 25px 21px;
  background: var(--surface);
  border-radius: 23px;
  box-shadow: 0 34px 90px -30px rgba(40, 27, 17, .65);
  animation: modal-pop .24s var(--ease) both;
}

.confirm-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  margin-bottom: 13px;
  color: var(--danger);
  background: #fbebe8;
  border-radius: 50%;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
}

.confirm-card h3 {
  margin: 0 0 5px;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
}

.confirm-card p {
  margin: 0 0 20px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.7;
}

.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 92px;
  z-index: 300;
  max-width: calc(100vw - 32px);
  padding: 9px 17px;
  color: #fff8ee;
  background: rgba(57, 49, 42, .95);
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 999px;
  box-shadow: 0 16px 34px -16px rgba(30, 20, 12, .8);
  font-size: 11.5px;
  line-height: 1.5;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 14px);
  transition: opacity .22s, transform .22s var(--ease);
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 34px 20px;
  color: var(--muted);
  background: rgba(255, 255, 255, .38);
  border: 1px dashed var(--line-strong);
  border-radius: 18px;
  text-align: center;
}

.empty-emoji {
  margin-bottom: 8px;
  font-size: 27px;
  filter: grayscale(.2);
}

.empty strong {
  display: block;
  margin-bottom: 2px;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
}

.empty p {
  max-width: 300px;
  margin: 0;
  font-size: 10.5px;
  line-height: 1.65;
}

.empty .btn {
  margin-top: 12px;
}

.empty.small {
  padding: 20px 15px;
}

.empty.small .empty-emoji {
  font-size: 21px;
}

.confetti {
  position: fixed;
  inset: 0;
  z-index: 400;
  overflow: hidden;
  pointer-events: none;
}

.confetti span {
  position: absolute;
  top: -8vh;
  font-size: 16px;
  animation: confetti-fall linear forwards;
}

.hidden {
  display: none !important;
}

/* ==========================================================================
   Animations
   ========================================================================== */

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-8deg); }
  50% { transform: translateY(-8px) rotate(8deg); }
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-9px) rotate(1deg); }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-pop {
  from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)) scale(.985); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

@keyframes slide-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

@keyframes rise-in {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes confetti-fall {
  0% { opacity: 0; transform: translate3d(0, -5vh, 0) rotate(0); }
  10% { opacity: 1; }
  100% { opacity: 0; transform: translate3d(var(--drift, 0px), 108vh, 0) rotate(var(--spin, 320deg)); }
}

.rise {
  animation: rise-in .5s var(--ease) both;
  animation-delay: calc(var(--d, 0) * 55ms);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *,
  *::before,
  *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .rise { animation-delay: 0s !important; }
}

/* ==========================================================================
   Responsive
   ========================================================================== */

@media (max-width: 1130px) {
  .app {
    grid-template-columns: 224px minmax(0, 1fr);
  }

  .sidebar {
    padding-right: 18px;
    padding-left: 18px;
  }

  #view {
    padding: 32px 30px 58px;
  }

  .hero {
    padding: 30px 30px 20px;
  }

  .hero-days .num {
    font-size: clamp(64px, 8vw, 88px);
  }

  .home-grid {
    gap: 17px;
  }

  .panel {
    padding: 19px;
  }

  .anniv-list {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 940px) {
  .app {
    display: block;
    min-height: 100dvh;
  }

  .sidebar {
    display: none;
  }

  .mobile-topbar {
    position: sticky;
    top: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 16px 7px;
    background: rgba(250, 246, 238, .88);
    border-bottom: 1px solid rgba(233, 223, 209, .5);
    backdrop-filter: blur(15px);
  }

  .brand-mini {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .14em;
  }

  #view {
    max-width: 720px;
    padding: 24px 18px 112px;
  }

  .bottom-nav {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 80;
    display: grid;
    grid-template-columns: repeat(5, 1fr);

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',

  function localDateStr(date = new Date()) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function parseLocalDate(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return new Date(NaN);
    const [year, month, day] = String(value).split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  function isValidDateStr(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
    const [year, month, day] = String(value).split('-').map(Number);
    const date = new Date(year, month - 1, day);
    return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
  }

  function todayStart() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function dayDiff(from, to) {
    const start = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
    const end = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.round((end - start) / 86400000);
  }

  function dateInYear(year, month, day) {
    const lastDay = new Date(year, month + 1, 0).getDate();
    return new Date(year, month, Math.min(day, lastDay));
  }

  function weekdayCN(date) {
    return `星期${['日', '一', '二', '三', '四', '五', '六'][date.getDay()]}`;
  }

  function fmtDateCN(value) {
    const date = parseLocalDate(value);
    if (Number.isNaN(date.getTime())) return '未设置';
    return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
  }

  function fmtDateShort(value) {
    const date = parseLocalDate(value);
    if (Number.isNaN(date.getTime())) return '';
    return `${date.getMonth() + 1}月${date.getDate()}日`;
  }

  function fmtDateDot(value) {
    const date = parseLocalDate(value);
    if (Number.isNaN(date.getTime())) return '';
    return `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())}`;
  }

  function fmtMonthDay(value) {
    return fmtDateShort(value);
  }

  function relDayLabel(value) {
    const date = parseLocalDate(value);
    if (Number.isNaN(date.getTime())) return '';
    const diff = dayDiff(date, todayStart());
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === 2) return '前天';
    if (diff > 2 && diff < 7) return `${diff} 天前`;
    return fmtDateShort(value);
  }

  function fmtMomentTime(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return '';
    const diff = dayDiff(new Date(date.getFullYear(), date.getMonth(), date.getDate()), todayStart());
    const hm = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    if (diff === 0) return `今天 ${hm}`;
    if (diff === 1) return `昨天 ${hm}`;
    if (diff > 1 && diff < 7) return `${diff} 天前`;
    return `${date.getMonth() + 1}月${date.getDate()}日 ${hm}`;
  }

  function toLocalInput(iso) {
    const date = iso ? new Date(iso) : new Date();
    if (Number.isNaN(date.getTime())) return '';
    const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 16);
  }

  function isoDaysAgo(days, hour = 20, minute = 0) {
    const date = new Date();
    date.setDate(date.getDate() - days);
    date.setHours(hour, minute, 0, 0);
    return date.toISOString();
  }

  function greeting() {

    if (hour < 13) return '中午好';
    if (hour < 18) return '下午好';
    if (hour < 23) return '晚上好';
    return '夜深了';

  function dayOfYear(date = new Date()) {
    const start = Date.UTC(date.getFullYear(), 0, 0);
    const now = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.floor((now - start) / 86400000);
  }

  function dailyItem(items) {
    return items[dayOfYear() % items.length];

  /* ------------------------------------------------------------------------
     Date / anniversary calculations
     ------------------------------------------------------------------------ */

  function daysTogether() {
    const start = parseLocalDate(state.togetherDate);
    if (Number.isNaN(start.getTime())) return { days: 0, future: false };
    const diff = dayDiff(start, todayStart());
    return diff >= 0
      ? { days: diff + 1, future: false }
      : { days: Math.abs(diff), future: true };
  }

  function nextAnniversary(anniversary) {
    const original = parseLocalDate(anniversary.date);
    const today = todayStart();
    if (Number.isNaN(original.getTime())) {
      return { next: today, days: 0, isToday: false, past: true };
    }

    if (anniversary.recurring) {
      let next = dateInYear(today.getFullYear(), original.getMonth(), original.getDate());
      if (dayDiff(today, next) < 0) {
        next = dateInYear(today.getFullYear() + 1, original.getMonth(), original.getDate());
      }
      const days = dayDiff(today, next);
      return { next, days, isToday: days === 0, past: false };
    }

    const days = dayDiff(today, original);
    return { next: original, days, isToday: days === 0, past: days < 0 };
  }

  function sortedAnniversaryItems() {
    return state.anniversaries
      .map((anniversary) => ({ anniversary, info: nextAnniversary(anniversary) }))
      .sort((a, b) => {
        if (a.info.past !== b.info.past) return a.info.past ? 1 : -1;
        if (a.info.past) return b.info.days - a.info.days;
        return a.info.days - b.info.days;
      });
  }

  function nextUpcomingAnniversary() {
    return sortedAnniversaryItems().find((item) => !item.info.past) || null;
  }

  function anniversaryProgress(anniversary) {
    if (!anniversary.recurring) return 0;
    const original = parseLocalDate(anniversary.date);
    const today = todayStart();
    if (Number.isNaN(original.getTime())) return 0;
    const next = dateInYear(today.getFullYear(), original.getMonth(), original.getDate());
    const adjustedNext = dayDiff(today, next) < 0
      ? dateInYear(today.getFullYear() + 1, original.getMonth(), original.getDate())
      : next;
    const last = dateInYear(adjustedNext.getFullYear() - 1, original.getMonth(), original.getDate());
    const total = Math.max(1, dayDiff(last, adjustedNext));
    const elapsed = Math.max(0, Math.min(total, dayDiff(last, today)));
    return Math.round((elapsed / total) * 100);
  }

  function hasAnniversaryToday() {
    const today = new Date();
    return state.anniversaries.some((anniversary) => {
      if (!anniversary.recurring) return false;
      const date = parseLocalDate(anniversary.date);
      return !Number.isNaN(date.getTime())
        && date.getMonth() === today.getMonth()
        && date.getDate() === today.getDate();
    });
  }

    return `palette-${sum % 6}`;

  function dailyRecipe() {
    if (!state.recipes.length) return null;
    return state.recipes[dayOfYear() % state.recipes.length];
  }

  function currentDinner() {
    return state.recipes.find((recipe) => recipe.id === ui.dinnerId) || dailyRecipe();
  }

  function moodOf(moment) {
    return MOODS[moment.mood] || MOODS.happy;
  }

  function avatarFor(author, extra = '') {
    return `<span class="avatar ${author} ${extra}" aria-hidden="true">${esc(initialOf(nameOf(author)))}</span>`;
  }

  function moodChip(moment) {
    const mood = moodOf(moment);
    return `<span class="mood-chip"><span class="mood-dot" style="background:${mood.color}"></span>${mood.emoji} ${mood.label}</span>`;
  }

  /* ------------------------------------------------------------------------
     Layout chrome
     ------------------------------------------------------------------------ */

  function applyTheme() {
    document.documentElement.dataset.theme = THEMES.includes(state.theme) ? state.theme : 'coral';
  }

  function updateSidebar() {
    const days = daysTogether();
    const me = $('#side-avatar-me');
    const partner = $('#side-avatar-partner');
    const daysEl = $('#side-days');
    if (me) me.textContent = initialOf(state.names.me);
    if (partner) partner.textContent = initialOf(state.names.partner);
    if (daysEl) {
      daysEl.innerHTML = days.future
        ? `距离在一起还有 <strong>${days.days.toLocaleString('zh-CN')}</strong> 天`
        : `在一起的第 <strong>${days.days.toLocaleString('zh-CN')}</strong> 天`;
    }
  }

  function setActiveNav(route) {
    $$('[data-nav]').forEach((link) => {
      const active = link.dataset.nav === route;
      link.classList.toggle('active', active);
      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }

  function updateFab(route) {
    const fab = $('#fab');
    if (fab) fab.classList.toggle('hidden', route !== 'home');
  }

  function getRoute() {
    const hash = String(window.location.hash || '').replace(/^#\/?/, '').split('?')[0];
    return ['home', 'moments', 'recipes', 'days', 'settings'].includes(hash) ? hash : 'home';
  }

  function updateTitle(route) {
    const titles = {
      home: '小满 · 两个人的小小宇宙',
      moments: '日常 · 小满',
      recipes: '菜谱 · 小满',
      days: '纪念日 · 小满',
      settings: '设置 · 小满',
    };
    document.title = titles[route] || titles.home;
  }

  /* ------------------------------------------------------------------------
     Rendering
     ------------------------------------------------------------------------ */

  function render() {
    const route = getRoute();
    applyTheme();
    updateSidebar();
    setActiveNav(route);
    updateFab(route);
    updateTitle(route);

    const views = {
      home: homeView,
      moments: momentsView,
      recipes: recipesView,
      days: daysView,
      settings: settingsView,
    };

    const view = $('#view');
    view.innerHTML = views[route]();
    if (route === 'moments') applyMomentFilter();
    if (route === 'recipes') applyRecipeFilters();
    if (route === 'home') {
      animateHeroDays();
      maybeCelebrate();
    }
  }

  function sectionHead(title, action = '') {
    return `<div class="section-head"><h2 class="section-title">${esc(title)}</h2>${action}</div>`;
  }

  function emptyState(emoji, title, text, action = '', small = false) {
    return `<div class="empty ${small ? 'small' : ''}">
      <span class="empty-emoji">${emoji}</span>
      <strong>${esc(title)}</strong>
      <p>${esc(text)}</p>
      ${action}
    </div>`;
  }

  function welcomeBanner() {
    return `<div class="welcome-banner rise">
      ${icon('sparkles')}
      <p>这是给你们俩的小空间。先去 <a href="#settings">设置</a> 里换成你们的名字和在一起的日子吧。</p>
      <button class="icon-btn" type="button" data-action="dismiss-banner" aria-label="知道了">${icon('close')}</button>

  function heroNext(item) {
    if (!item) {
      return `<a class="hero-next" href="#days">
        <span class="hero-next-icon">🌱</span>
        <span class="hero-next-copy"><small>下一个纪念日</small><strong>还没有纪念日，去添加一个吧</strong></span>
        ${icon('chevron')}
      </a>`;
    }
    const { anniversary, info } = item;
    const label = info.isToday ? '就是今天' : `还有 ${info.days} 天`;
    return `<a class="hero-next" href="#days">
      <span class="hero-next-icon">${esc(anniversary.icon)}</span>
      <span class="hero-next-copy">
        <small>下一个纪念日</small>
        <strong>${esc(anniversary.title)} · <em>${label}</em></strong>
      </span>
      ${icon('chevron')}
    </a>`;
  }

  function miniMoment(moment) {
    const photo = safePhoto(moment.photo);
    return `<article class="moment-mini">
      <div class="moment-mini-head">
        ${avatarFor(moment.author, 'tiny')}
        <span class="mini-name">${esc(nameOf(moment.author))}</span>
        <span class="mini-time">${esc(fmtMomentTime(moment.date))}</span>
      </div>
      <p>${esc(moment.text)}</p>
      ${photo ? `<img class="mini-photo" src="${photo}" alt="日常照片">` : ''}
      <div class="moment-mini-foot">${moodChip(moment)}</div>
    </article>`;
  }

  function dinnerPanel(recipe) {
    if (!recipe) {
      return `<section class="side-panel dinner-panel rise" style="--d:2">
        ${sectionHead('今晚吃什么', '<span class="mini-time">灵感</span>')}
        ${emptyState('🍳', '菜谱还是空的', '先收藏一道你们想一起做的菜吧。', `<button class="btn btn-primary btn-sm" data-action="add-recipe">${icon('plus')} 添加菜谱</button>`, true)}
      </section>`;
    }
    return `<section class="side-panel dinner-panel rise" style="--d:2">
      ${sectionHead('今晚吃什么', '<span class="mini-time">今日灵感</span>')}
      <div class="dinner-emoji">${esc(recipe.emoji || '🍳')}</div>
      <h3 class="dinner-name">${esc(recipe.name)}</h3>
      <p class="dinner-desc">${esc(recipe.desc || '一起做一顿好吃的。')}</p>
      <div class="dinner-meta">
        <span>${icon('clock')}${recipe.time} 分钟</span>
        <span>${esc(recipe.difficulty)}</span>
        ${recipe.favorite ? '<span>♥ 收藏</span>' : ''}
      </div>
      <div class="dinner-actions">
        <button class="btn btn-ghost btn-sm" type="button" data-action="random-recipe">${icon('dice')} 换一道</button>
        <button class="btn btn-primary btn-sm" type="button" data-action="open-recipe" data-id="${esc(recipe.id)}">看做法</button>
      </div>
    </section>`;
  }

  function promptPanel(prompt) {
    return `<section class="side-panel prompt-panel rise" style="--d:3">
      <div class="prompt-label">${icon('sparkles')} 今天可以一起</div>
      <p class="prompt-text">${esc(prompt)}</p>
      <button class="btn btn-sm" type="button" data-action="suggestion" data-prompt="${esc(prompt)}">记下这一刻 ${icon('arrow')}</button>
    </section>`;
  }

  function homeView() {
    const days = daysTogether();
    const next = nextUpcomingAnniversary();
    const latest = sortedMoments().slice(0, 2);
    const dinner = currentDinner();
    const prompt = dailyItem(PROMPTS);
    const today = new Date();
    const subtitle = dailyItem(SUBTITLES);

    return `<header class="page-head home-head">
      <div>
        <p class="eyebrow">${weekdayCN(today)} · ${fmtDateShort(localDateStr(today))} · ${days.future ? '期待中' : '我们的小日子'}</p>
        <h1>${greeting()}，${esc(state.names.me)}<span class="hello-dot"></span></h1>
        <p class="page-sub">${esc(subtitle)}</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-ghost" type="button" data-action="add-moment">${icon('edit')}<span class="btn-label">记录今天</span></button>
      </div>
    </header>
    ${state.onboarded ? '' : welcomeBanner()}
    <section class="hero">
      <div class="hero-copy">
        <div class="hero-kicker">${days.future ? '距离在一起还有' : '我们在一起'}</div>
        <div class="hero-days">
          <span class="num" id="hero-days-num" data-target="${days.days}">${days.days.toLocaleString('zh-CN')}</span>
          <span class="unit">天</span>
        </div>
        <p class="hero-names"><strong>${esc(state.names.me)}</strong> &amp; <strong>${esc(state.names.partner)}</strong> · 从 ${fmtDateCN(state.togetherDate)} 开始</p>
        <div class="hero-chips">
          <span>日常 <strong>${state.moments.length}</strong></span>
          <span>菜谱 <strong>${state.recipes.length}</strong></span>
          <span>纪念日 <strong>${state.anniversaries.length}</strong></span>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">${heroArt()}<span class="art-note">${esc(dailyItem(ART_NOTES))}</span></div>
      ${heroNext(next)}
    </section>
    <div class="home-grid">
      <section class="panel rise" style="--d:1">
        ${sectionHead('最近的小事', `<button class="text-link" type="button" data-action="go" data-route="moments">全部 ${icon('chevron')}</button>`)}
        ${latest.length ? latest.map(miniMoment).join('') : emptyState('🌱', '还没有日常', '今天发生的一件小事，就可以是第一条。')}
        <button class="btn btn-soft btn-block" type="button" data-action="add-moment" style="margin-top:14px">${icon('plus')} 写一条日常</button>
      </section>
      <aside class="home-side">
        ${dinnerPanel(dinner)}
        ${promptPanel(prompt)}
      </aside>
    </div>`;
  }

  function groupMoments(list) {
    const groups = new Map();
    list.forEach((moment) => {
      const date = new Date(moment.date);
      const key = Number.isNaN(date.getTime()) ? localDateStr() : localDateStr(date);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(moment);
    });
    return Array.from(groups.entries()).map(([key, moments]) => {
      const date = parseLocalDate(key);
      const day = relDayLabel(key);
      const calendar = fmtDateShort(key);
      const small = day === calendar ? weekdayCN(date) : `${calendar} · ${weekdayCN(date)}`;
      return `<section class="timeline-group" data-day="${key}">
        <h3 class="timeline-date">${esc(day)} <small>${small}</small></h3>
        ${moments.map(momentCard).join('')}
      </section>`;
    }).join('');
  }

  function momentCard(moment) {
    const photo = safePhoto(moment.photo);
    return `<article class="moment-card" data-author="${moment.author}">
      <div class="moment-head">
        ${avatarFor(moment.author)}
        <div class="moment-author">
          <strong>${esc(nameOf(moment.author))}</strong>
          <span>${esc(fmtMomentTime(moment.date))}</span>
        </div>
        <div class="moment-tools">
          <button class="icon-btn" type="button" data-action="edit-moment" data-id="${esc(moment.id)}" aria-label="编辑这条日常">${icon('edit')}</button>
          <button class="icon-btn danger" type="button" data-action="delete-moment" data-id="${esc(moment.id)}" aria-label="删除这条日常">${icon('trash')}</button>
        </div>
      </div>
      <p class="moment-text">${esc(moment.text)}</p>
      ${photo ? `<img class="moment-photo" src="${photo}" alt="日常照片">` : ''}
      <div class="moment-foot">${moodChip(moment)}</div>
    </article>`;
  }

  function momentsView() {
    const list = sortedMoments();
    const mine = list.filter((moment) => moment.author === 'me').length;
    const partner = list.length - mine;
    return `<header class="page-head">
      <div>
        <p class="eyebrow">OUR LITTLE THINGS</p>
        <h1 class="page-title">日常碎片</h1>
        <p class="page-sub">把普通的日子，过成值得收藏的故事。</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-primary" type="button" data-action="add-moment">${icon('plus')}<span class="btn-label">记录一件小事</span></button>
      </div>
    </header>
    <div class="filter-bar">
      <div class="chips-row" id="moment-filters">
        <button class="chip ${ui.momentFilter === 'all' ? 'active' : ''}" type="button" data-action="filter-moments" data-filter="all">全部 · ${list.length}</button>
        <button class="chip ${ui.momentFilter === 'me' ? 'active' : ''}" type="button" data-action="filter-moments" data-filter="me">${esc(state.names.me)} · ${mine}</button>
        <button class="chip ${ui.momentFilter === 'partner' ? 'active' : ''}" type="button" data-action="filter-moments" data-filter="partner">${esc(state.names.partner)} · ${partner}</button>
      </div>
      <span class="count-note">${list.length ? '按时间倒序排列' : '还没有记录'}</span>
    </div>
    ${list.length
      ? `<div class="timeline">${groupMoments(list)}</div>
         <div class="empty small hidden" id="moment-filter-empty">
           <span class="empty-emoji">🫧</span>
           <strong>这一栏还没有内容</strong>
           <p>换个人看看，或者现在就补上一条。</p>
         </div>`
      : emptyState('🌱', '还没有日常', '今天发生的一件小事，就可以是第一条。', `<button class="btn btn-primary btn-sm" data-action="add-moment">${icon('plus')} 写下第一条</button>`)}
    `;
  }

  function recipeCard(recipe) {
    const palette = recipePalette(recipe);
    const tags = recipe.tags.slice(0, 2);
    const searchText = [recipe.name, recipe.desc, ...recipe.tags, ...recipe.ingredients.map((item) => item.name)].join(' ');
    return `<article class="recipe-card" tabindex="0" role="button" data-action="open-recipe" data-id="${esc(recipe.id)}" data-search="${esc(searchText)}" data-tags="${esc(recipe.tags.join(','))}" aria-label="查看菜谱：${esc(recipe.name)}">
      <div class="recipe-cover ${palette}">
        <span class="recipe-emoji">${esc(recipe.emoji || '🍳')}</span>
        <button class="recipe-fav ${recipe.favorite ? 'is-fav' : ''}" type="button" data-action="toggle-favorite" data-fav-id="${esc(recipe.id)}" aria-label="${recipe.favorite ? '取消收藏' : '收藏'}" aria-pressed="${recipe.favorite}">${icon('heart')}</button>
        <span class="recipe-time">${icon('clock')}${recipe.time} 分钟</span>
      </div>
      <div class="recipe-body">
        <h3 class="recipe-name">${esc(recipe.name)}</h3>
        <p class="recipe-desc">${esc(recipe.desc || '一道想和 TA 一起做的菜。')}</p>
        <div class="recipe-foot">
          ${tags.map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')}
          ${recipe.cookedAt ? `<span class="recipe-cooked">${icon('check')}做过</span>` : ''}
        </div>
      </div>
    </article>`;
  }

  function recipesView() {
    const allTags = ['全部'];
    state.recipes.forEach((recipe) => {
      recipe.tags.forEach((tag) => {
        if (!allTags.includes(tag)) allTags.push(tag);
      });
    });
    if (!allTags.includes(ui.recipeTag)) ui.recipeTag = '全部';
    const favorites = state.recipes.filter((recipe) => recipe.favorite).length;

    return `<header class="page-head">
      <div>
        <p class="eyebrow">OUR RECIPE BOOK</p>
        <h1 class="page-title">我们的菜谱</h1>
        <p class="page-sub">一起研究，一起变胖。收录 ${state.recipes.length} 道，收藏 ${favorites} 道。</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-ghost" type="button" data-action="random-recipe">${icon('dice')}<span class="btn-label">随机一道</span></button>
        <button class="btn btn-primary" type="button" data-action="add-recipe">${icon('plus')}<span class="btn-label">新菜谱</span></button>
      </div>
    </header>
    <div class="recipe-toolbar">
      <div class="search-box">
        ${icon('search')}
        <input id="recipe-search" type="search" value="${esc(ui.recipeQuery)}" placeholder="搜菜名、食材或标签…" aria-label="搜索菜谱">
      </div>
      <div class="chips-row" id="recipe-tags">
        ${allTags.map((tag) => `<button class="chip ${ui.recipeTag === tag ? 'active' : ''}" type="button" data-action="filter-tag" data-tag="${esc(tag)}">${esc(tag)}</button>`).join('')}
      </div>
    </div>
    <div class="recipe-grid" id="recipe-grid">
      ${state.recipes.length
        ? state.recipes.map(recipeCard).join('')
        : `<div class="recipe-empty">${emptyState('🍳', '菜谱还是空的', '把你们常做的那道菜写下来吧，以后就不怕忘。', `<button class="btn btn-primary btn-sm" data-action="add-recipe">${icon('plus')} 添加第一道菜</button>`)}</div>`}
    </div>
    <div class="empty small hidden" id="recipe-filter-empty">
      <span class="empty-emoji">🔍</span>
      <strong>没有找到这道菜</strong>
      <p>换个关键词，或者点「全部」看看。</p>
    </div>
    <p class="count-note" id="recipe-count" style="margin-top:14px">${state.recipes.length ? `共 ${state.recipes.length} 道菜` : ''}</p>
    `;
  }

  function annivFeature(item) {
    const { anniversary, info } = item;
    const isPast = info.past;
    const isToday = info.isToday;
    const number = isToday ? '今天' : Math.abs(info.days);
    const unit = isToday ? '纪念日' : (isPast ? '天前' : '天后');
    const progress = isPast ? 0 : anniversaryProgress(anniversary);
    return `<section class="anniv-feature rise">
      <div>
        <p class="eyebrow">${isPast ? '最近的重要日子' : '下一个纪念日'}</p>
        <h2 class="anniv-feature-title">${esc(anniversary.icon)} ${esc(anniversary.title)}</h2>
        <p class="anniv-feature-date">${anniversary.recurring ? `每年 ${fmtMonthDay(anniversary.date)}` : fmtDateCN(anniversary.date)}${anniversary.note ? ` · ${esc(anniversary.note)}` : ''}</p>
      </div>
      <div class="anniv-count ${isToday ? 'is-today' : ''}">
        <span class="num">${number}</span>
        <span class="unit">${unit}</span>
      </div>
      ${isPast ? '' : `<div class="anniv-progress">
        <div class="anniv-progress-bar"><span style="width:${progress}%"></span></div>
        <small>${isToday ? '就是今天' : `这一年已走过 ${progress}%`}</small>
      </div>`}
    </section>`;
  }

  function annivRow(item) {
    const { anniversary, info } = item;
    const isPast = info.past;
    const isToday = info.isToday;
    const number = isToday ? '今天' : Math.abs(info.days);
    const unit = isToday ? '纪念日' : (isPast ? '天前' : '天后');
    return `<article class="anniv-row">
      <span class="anniv-icon">${esc(anniversary.icon)}</span>
      <div class="anniv-row-main">
        <strong>${esc(anniversary.title)}${anniversary.recurring ? '<span class="recurring">每年</span>' : ''}</strong>
        <small>${anniversary.recurring ? '每年 ' : ''}${fmtMonthDay(anniversary.date)}${anniversary.note ? ` · ${esc(anniversary.note)}` : ''}</small>
      </div>
